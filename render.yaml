databases:
  - name: agenda-medica-db
    plan: free
    region: virginia
    databaseName: agenda_medica
    user: agenda_medica

services:
  - type: web
    name: agenda-medica
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agenda-medica-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: AUTH_PASSWORD_HASH
        sync: false
